name: P0 contracts and packaged Electron
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: P0 logic and negative contracts (fake runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  mac-electron:
    name: Actual macOS Electron development package (fake runtime)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run install:electron
      - run: npm run preflight -- --require-macos
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:mac
      - name: Use exact packaged executable
        run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('out/package-evidence.json','utf8'));fs.appendFileSync(process.env.GITHUB_ENV, 'AN_PACKAGED_EXECUTABLE='+p.executable+'\nAN_APP_PATH='+p.appPath+'\n')"
      - run: npm run test:electron
      - run: npm run test:mac
      - name: Retain P0 validation evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-macos-validation-${{ github.sha }}
          path: |
            out/package-evidence.json
            playwright-report/
            test-results/
          retention-days: 7
